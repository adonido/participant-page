
<div class="container mt-5">

  <div class="card shadow p-4">

    <h2 class="mb-4">Edit Participant</h2>

    @if (isLoading()) {

      <p>Loading participant information...</p>

    } @else {

      <form
        [formGroup]="participantForm"
        (ngSubmit)="updateParticipant()">

        <div class="mb-3">
          <label class="form-label">Full Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="name">
        </div>

        <div class="mb-3">
          <label class="form-label">BIC</label>
          <input
            type="text"
            class="form-control"
            formControlName="bic">
        </div>

        <div class="mb-3">
          <label class="form-label">Short Name</label>
          <input
            type="text"
            class="form-control"
            formControlName="shortName">
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            class="form-control"
            formControlName="email">
        </div>

        <div class="mb-3">
          <label class="form-label">Phone</label>
          <input
            type="text"
            class="form-control"
            formControlName="phoneNumber">
        </div>

        <div class="mb-4">
          <label class="form-label">Status</label>
          <select
            class="form-select"
            formControlName="status">

            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>

          </select>
        </div>

        <button
          type="submit"
          class="btn btn-primary me-2"
          [disabled]="isSaving">

          {{ isSaving ? 'Updating...' : 'Update Participant' }}

        </button>

        <button
          type="button"
          class="btn btn-secondary"
          (click)="cancel()">

          Cancel

        </button>

      </form>

    }

  </div>

</div>
