
<div class="container mt-5">

  <div class="card shadow p-4">

    <h2 class="mb-4">Register New Participant</h2>

    <form [formGroup]="participantForm"
          (ngSubmit)="saveParticipant()">

      <div class="mb-3">
        <label class="form-label">Full Name</label>

        <input
          type="text"
          class="form-control"
          formControlName="name"
          placeholder="Enter full name"
          [class.is-invalid]="participantForm.get('name')?.invalid && participantForm.get('name')?.touched">

        <small class="error-message"
          [hidden]="!(participantForm.get('name')?.hasError('required') && participantForm.get('name')?.touched)">
          Full name is required.
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label">BIC</label>

        <input
          type="text"
          class="form-control"
          formControlName="bic"
          placeholder="Enter BIC"
          [class.is-invalid]="participantForm.get('bic')?.invalid && participantForm.get('bic')?.touched">

        <small class="error-message"
          [hidden]="!participantForm.get('bic')?.touched || !participantForm.get('bic')?.invalid">
          BIC is required and must contain 8–11 letters or numbers.
        </small>
      </div>
      <div class="mb-3">
        <label class="form-label">Short Name</label>

        <input
          type="text"
          class="form-control"
          formControlName="shortName"
          placeholder="Enter short name"
          [class.is-invalid]="participantForm.get('shortName')?.invalid && participantForm.get('shortName')?.touched">

        <small class="error-message"
          [hidden]="!(participantForm.get('shortName')?.invalid && participantForm.get('shortName')?.touched)">
          Short name is required.
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>

        <input
          type="email"
          class="form-control"
          formControlName="email"
          placeholder="Enter email"
          [class.is-invalid]="participantForm.get('email')?.invalid && participantForm.get('email')?.touched">

        <small class="error-message"
          [hidden]="!participantForm.get('email')?.touched || !participantForm.get('email')?.invalid">
          Please enter a valid email address.
        </small>
      </div>

    
      <div class="mb-3">
        <label class="form-label">Phone</label>

     <input
  type="text"
  class="form-control"
  formControlName="phoneNumber"
  placeholder="Enter phone number"
  inputmode="numeric"
  (input)="onPhoneInput($event)"
  [class.is-invalid]="participantForm.get('phoneNumber')?.invalid && participantForm.get('phoneNumber')?.touched">
        <small class="error-message"
          [hidden]="!(participantForm.get('phoneNumber')?.invalid && participantForm.get('phoneNumber')?.touched)">
          Phone number is required.
        </small>
      </div>

      <div class="mb-4">
        <label class="form-label">Status</label>

        <select
          class="form-select"
          formControlName="status"
          [class.is-invalid]="participantForm.get('status')?.invalid && participantForm.get('status')?.touched">

          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>

        </select>

        <small class="error-message"
          [hidden]="!(participantForm.get('status')?.invalid && participantForm.get('status')?.touched)">
          Status is required.
        </small>
      </div>

      <div class="mb-4">

        <label class="form-label">Participant Logo</label>

        <input
          type="file"
          class="form-control"
          accept="image/png, image/jpeg"
          (change)="onLogoSelected($event)">

        <small class="text-muted">
          Accepted formats: PNG and JPG. Maximum size: 2 MB.
        </small>
        <div *ngIf="logoPreview" class="mt-3">

          <p class="fw-bold">Logo Preview:</p>

          <img
            [src]="logoPreview"
            alt="Participant Logo Preview"
            style="width: 120px; height: 120px; object-fit: contain; border: 1px solid #ddd; padding: 5px;">

        </div>

      </div>

      <button
        type="submit"
        class="btn btn-primary me-2">
        Save
      </button>

      <button
        type="button"
        class="btn btn-secondary"
        (click)="cancel()">
        Cancel
      </button>

    </form>

  </div>

</div>
